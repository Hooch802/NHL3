<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NHL Scores Live</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <div class="top-row">
      <h1>NHL Scores</h1>
      <div class="date-nav">
        <button id="prev" aria-label="Previous day">&larr;</button>
        <span id="date-label"></span>
        <button id="next" aria-label="Next day">&rarr;</button>
        <button id="today" class="today-btn">Today</button>
      </div>
    </div>
    <div class="status-line">
      <span id="updated">Loading…</span>
      <span class="legend">ML = pregame moneyline · O/U = pregame total</span>
    </div>
  </header>

  <main id="games" class="games" aria-live="polite"></main>

  <footer class="foot">
    Data: ESPN public scoreboard. Clock ticks locally between refreshes (every 15s while games are live) and resyncs on each refresh.
  </footer>

  <script src="app.js"></script>
</body>
</html>
